<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101510">
    <title>Spotify - Music On The Go</title>
    <link rel="stylesheet" href="./HomePage.css">
    <link rel="stylesheet" href="./Navbar.css">
    <link rel="stylesheet" href="./Theme.css">
</head>

<body>
    <nav class="navbar">
        <ul class="navbar-nav">
            <li class="logo">
                <a class="nav-link" href="./index.html">
                    <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"></circle><path d="M6.5 9.2c4.2-1.2 8.5-.8 11.6 1.1M7.2 12.3c3.4-1 6.9-.6 9.6.9M8 15.3c2.6-.7 5.2-.4 7.2.7" fill="none" stroke="#101510" stroke-linecap="round" stroke-width="1.7"></path></svg>
                    <span class="link-text">Spotify</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="./index.html" aria-current="page">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg>
                    <span class="link-text">Home</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="./Library.html">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"></path></svg>
                    <span class="link-text">Library</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="./About.html">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M5 21a7 7 0 0 1 14 0"></path></svg>
                    <span class="link-text">About</span>
                </a>
            </li>
        </ul>
    </nav>

    <main class="page-content">
        <header class="topbar">
            <div class="history-controls" aria-label="Page history">
                <button class="history-button" type="button" aria-label="Go back" onclick="history.back()">‹</button>
                <button class="history-button" type="button" aria-label="Go forward"
                    onclick="history.forward()">›</button>
            </div>
            <a class="library-shortcut" href="./Library.html">Explore your library</a>
        </header>

        <section class="welcome-panel" aria-labelledby="welcome-title">
            <div>
                <p class="eyebrow">GOOD MUSIC. GOOD MOOD.</p>
                <h1 id="welcome-title">Your soundtrack<br>starts here.</h1>
                <p class="welcome-copy">Find a favorite, press play, and make the moment yours.</p>
                <a class="browse-button" href="#made-for-you">Browse all songs</a>
            </div>
            <div class="welcome-art" aria-hidden="true">
                <img src="./Resources/SpotiFlyer.svg" alt="">
            </div>
        </section>

        <section class="music-section" id="made-for-you" aria-labelledby="music-title">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">A LITTLE BIT OF EVERYTHING</p>
                    <h2 id="music-title">Made for you</h2>
                </div>
                <span class="track-count" id="trackCount"></span>
            </div>
            <div class="song-list" id="songList" aria-live="polite"></div>
        </section>
    </main>

    <footer class="player" aria-label="Music player">
        <div class="now-playing">
            <img class="player-cover" id="playerCover" src="./Resources/SpotiFlyer.png" alt="">
            <div class="track-details">
                <span class="player-label">NOW PLAYING</span>
                <span class="player-title" id="masterSongName">Choose a song to start listening</span>
                <span class="player-status" id="playerStatus" role="status"></span>
            </div>
        </div>
        <div class="player-controls">
            <div class="control-buttons">
                <button class="control-button" id="previous" type="button" aria-label="Previous song">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 5v14M19 6l-9 6 9 6z"></path>
                    </svg>
                </button>
                <button class="control-button play-button" id="masterPlay" type="button" aria-label="Play">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m8 5 12 7-12 7z"></path>
                    </svg>
                </button>
                <button class="control-button" id="next" type="button" aria-label="Next song">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 5v14M5 6l9 6-9 6z"></path>
                    </svg>
                </button>
            </div>
            <div class="progress-row">
                <span id="currentTime">0:00</span>
                <input type="range" id="ProgressBar" min="0" max="100" value="0" aria-label="Seek through song">
                <span id="duration">0:00</span>
            </div>
        </div>
        <div class="player-spacer" aria-hidden="true"></div>
    </footer>

    <script src="./script.js"></script>
</body>

</html>
